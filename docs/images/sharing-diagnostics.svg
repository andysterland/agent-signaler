    <rect x="102" y="346" width="516" height="44" rx="9" fill="#1e293b"/><text x="122" y="374" fill="#4ade80">✓</text><text x="152" y="374" fill="#e2e8f0">Azure CLI</text><text x="540" y="374" fill="#86efac">Passed</text>
