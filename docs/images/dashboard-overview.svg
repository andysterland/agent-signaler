<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="title desc">
  <title id="title">Synthetic Agent Signaler dashboard overview</title>
  <desc id="desc">A dark Windows dashboard with six fictional development machines in executing, waiting, succeeded, failed, idle, and offline states.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1220"/><stop offset="1" stop-color="#172554"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="16" flood-opacity=".35"/></filter>
  </defs>
  <rect width="1440" height="810" fill="url(#bg)"/>
  <rect x="70" y="55" width="1300" height="700" rx="22" fill="#111827" stroke="#334155" filter="url(#shadow)"/>
  <text x="112" y="112" fill="#f8fafc" font-family="Segoe UI,Arial" font-size="34" font-weight="700">Agent Signaler</text>
  <text x="112" y="148" fill="#94a3b8" font-family="Segoe UI,Arial" font-size="18">6 development machines · synthetic preview</text>
  <rect x="1120" y="90" width="108" height="44" rx="10" fill="#1e293b"/><text x="1145" y="118" fill="#cbd5e1" font-family="Segoe UI,Arial" font-size="16">Compact</text>
  <rect x="1244" y="90" width="84" height="44" rx="10" fill="#2563eb"/><text x="1264" y="118" fill="white" font-family="Segoe UI,Arial" font-size="16">Settings</text>
  <g font-family="Segoe UI,Arial">
    <g transform="translate(112 195)"><rect width="370" height="220" rx="18" fill="#123b68" stroke="#38bdf8"/><circle cx="44" cy="42" r="12" fill="#22c55e"/><text x="70" y="49" fill="#e0f2fe" font-size="22" font-weight="700">Build Agent</text><text x="28" y="104" fill="#7dd3fc" font-size="54">▶</text><text x="100" y="98" fill="#f8fafc" font-size="26" font-weight="700">Executing</text><text x="100" y="128" fill="#bae6fd" font-size="16">Copilot CLI · preToolUse</text><text x="28" y="176" fill="#dbeafe" font-size="16">Dev Box: devbox-build-01</text><text x="28" y="202" fill="#93c5fd" font-size="14">Updated moments ago</text></g>
    <g transform="translate(535 195)"><rect width="370" height="220" rx="18" fill="#5a3c0b" stroke="#f59e0b"/><circle cx="44" cy="42" r="12" fill="#22c55e"/><text x="70" y="49" fill="#fef3c7" font-size="22" font-weight="700">Docs Review</text><text x="28" y="104" fill="#fbbf24" font-size="54">●</text><text x="100" y="98" fill="#fffbeb" font-size="26" font-weight="700">Waiting</text><text x="100" y="128" fill="#fde68a" font-size="16">VS Code · permission request</text><text x="28" y="176" fill="#fef3c7" font-size="16">Dev Box: devbox-docs-01</text><text x="28" y="202" fill="#fcd34d" font-size="14">Needs user input</text></g>
    <g transform="translate(958 195)"><rect width="370" height="220" rx="18" fill="#12452b" stroke="#22c55e"/><circle cx="44" cy="42" r="12" fill="#22c55e"/><text x="70" y="49" fill="#dcfce7" font-size="22" font-weight="700">Test Runner</text><text x="28" y="104" fill="#4ade80" font-size="54">✓</text><text x="100" y="98" fill="#f0fdf4" font-size="26" font-weight="700">Succeeded</text><text x="100" y="128" fill="#bbf7d0" font-size="16">Copilot CLI · session complete</text><text x="28" y="176" fill="#dcfce7" font-size="16">Dev Box: devbox-test-01</text><text x="28" y="202" fill="#86efac" font-size="14">Result visible for 60 seconds</text></g>
    <g transform="translate(112 457)"><rect width="370" height="220" rx="18" fill="#5a1c22" stroke="#ef4444"/><circle cx="44" cy="42" r="12" fill="#22c55e"/><text x="70" y="49" fill="#fee2e2" font-size="22" font-weight="700">API Refactor</text><text x="28" y="104" fill="#f87171" font-size="54">×</text><text x="100" y="98" fill="#fef2f2" font-size="26" font-weight="700">Failed</text><text x="100" y="128" fill="#fecaca" font-size="16">Visual Studio · tool failure</text><text x="28" y="176" fill="#fee2e2" font-size="16">Dev Box: devbox-api-01</text><text x="28" y="202" fill="#fca5a5" font-size="14">No prompt or response content stored</text></g>
    <g transform="translate(535 457)"><rect width="370" height="220" rx="18" fill="#293548" stroke="#64748b"/><circle cx="44" cy="42" r="12" fill="#22c55e"/><text x="70" y="49" fill="#f1f5f9" font-size="22" font-weight="700">Local Sandbox</text><text x="28" y="104" fill="#94a3b8" font-size="54">—</text><text x="100" y="98" fill="#f8fafc" font-size="26" font-weight="700">Idle</text><text x="100" y="128" fill="#cbd5e1" font-size="16">Client connected</text><text x="28" y="176" fill="#e2e8f0" font-size="16">Dev Box: Not mapped</text><text x="28" y="202" fill="#94a3b8" font-size="14">Ready for the next session</text></g>
    <g transform="translate(958 457)"><rect width="370" height="220" rx="18" fill="#242b37" stroke="#475569"/><circle cx="44" cy="42" r="12" fill="#64748b"/><text x="70" y="49" fill="#cbd5e1" font-size="22" font-weight="700">Release Check</text><text x="28" y="104" fill="#64748b" font-size="54">○</text><text x="100" y="98" fill="#e2e8f0" font-size="26" font-weight="700">Offline</text><text x="100" y="128" fill="#94a3b8" font-size="16">Last seen 14 minutes ago</text><text x="28" y="176" fill="#cbd5e1" font-size="16">Dev Box: devbox-release-01</text><text x="28" y="202" fill="#64748b" font-size="14">Heartbeat deadline exceeded</text></g>
  </g>
</svg>
