name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 6 * * 1"

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@v3
        with:
          languages: csharp, c-cpp
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Build managed solution
        shell: pwsh
        run: |
          dotnet restore AgentSignaler.slnx -p:Platform=x64
          dotnet build AgentSignaler.slnx --no-restore --configuration Release -p:Platform=x64
      - name: Build native bootstrapper policy tests
        shell: powershell
        run: .\scripts\Build-DashboardBootstrapper.ps1 -Version 1.0.14
      - uses: github/codeql-action/analyze@v3
        with:
          upload: ${{ github.event.repository.private == false }}
