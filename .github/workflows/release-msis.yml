name: Release MSIs

on:
  workflow_dispatch:
    inputs:
      version:
        description: Optional MSI version (MAJOR.MINOR.PATCH); blank increments the latest release
        required: false
        default: ""
        type: string
      prerelease:
        description: Mark the GitHub Release as a prerelease
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-msis-${{ github.repository }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: [self-hosted, Windows, X64, artifact-signing]
    environment: artifact-signing
    timeout-minutes: 75
    env:
      AGENT_SIGNALER_LIVE_TUNNEL_TEST: "0"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      RELEASE_REQUESTED_VERSION: ${{ inputs.version }}
      RELEASE_PRERELEASE: ${{ inputs.prerelease }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify .NET SDK
        shell: pwsh
        run: |
          $sdk = dotnet --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host "Using .NET SDK $sdk"
      - name: Validate release request
        shell: pwsh
        run: |
          $releaseRecords = & gh api --paginate "repos/$env:GITHUB_REPOSITORY/releases" `
            --jq '.[] | [.tag_name, .draft] | @tsv'
          if ($LASTEXITCODE -ne 0) {
            throw "Could not enumerate published releases (gh exit code $LASTEXITCODE)."
          }

          $highest = $null
          $allReleaseTags = [Collections.Generic.HashSet[string]]::new(
            [StringComparer]::Ordinal)
          foreach ($record in $releaseRecords) {
            $tag, $isDraft = $record -split "`t", 2
            [void]$allReleaseTags.Add($tag)
            if ($isDraft -eq 'true') {
              continue
            }
            if ($tag -notmatch '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') {
              continue
            }

            $parts = @($Matches[1], $Matches[2], $Matches[3])
            $values = foreach ($part in $parts) {
              $value = 0L
              if (-not [long]::TryParse(
                  $part,
                  [Globalization.NumberStyles]::None,
                  [Globalization.CultureInfo]::InvariantCulture,
                  [ref]$value)) {
                throw "Release tag $tag has a numeric component too large to process."
              }
              $value
            }

            $candidate = [pscustomobject]@{
              Major = $values[0]
              Minor = $values[1]
              Patch = $values[2]
            }
            if ($null -eq $highest -or
                $candidate.Major -gt $highest.Major -or
                ($candidate.Major -eq $highest.Major -and $candidate.Minor -gt $highest.Minor) -or
                ($candidate.Major -eq $highest.Major -and
                 $candidate.Minor -eq $highest.Minor -and
                 $candidate.Patch -gt $highest.Patch)) {
              $highest = $candidate
            }
          }

          if ($null -ne $highest -and
              ($highest.Major -gt 255 -or $highest.Minor -gt 255 -or $highest.Patch -gt 65535)) {
            throw "Highest release version v$($highest.Major).$($highest.Minor).$($highest.Patch) exceeds MSI limits."
          }

          if (-not [string]::IsNullOrEmpty($env:RELEASE_REQUESTED_VERSION)) {
            . .\scripts\UpdaterPolicy.ps1
            $requested = ConvertTo-AgentSignalerVersion $env:RELEASE_REQUESTED_VERSION
            if ($null -ne $highest -and
                $requested -le [version]"$($highest.Major).$($highest.Minor).$($highest.Patch)") {
              throw 'The requested version must be newer than every published release.'
            }
            $next = [pscustomobject]@{
              Major = $requested.Major
              Minor = $requested.Minor
              Patch = $requested.Build
            }
          }
          elseif ($null -eq $highest) {
            $next = [pscustomobject]@{ Major = 0L; Minor = 0L; Patch = 1L }
          }
          else {
            if ($highest.Patch -eq 65535) {
              throw "Cannot increment v$($highest.Major).$($highest.Minor).$($highest.Patch): the MSI patch limit is 65535."
            }
            $next = [pscustomobject]@{
              Major = $highest.Major
              Minor = $highest.Minor
              Patch = $highest.Patch + 1
            }
          }

          $releaseVersion = "$($next.Major).$($next.Minor).$($next.Patch)"
          if ($allReleaseTags.Contains("v$releaseVersion")) {
            throw "Release v$releaseVersion already exists; existing releases are never replaced."
          }
          "RELEASE_VERSION=$releaseVersion" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Selected release version: $releaseVersion"
      - name: Audit repository contents
        shell: powershell
        run: .\scripts\Test-PublicRepository.ps1
      - name: Publish application payloads
        shell: powershell
        run: .\scripts\Build-Installers.ps1 -Version $env:RELEASE_VERSION -PublishOnly
      - name: Build and test release contracts
        shell: pwsh
        run: |
          dotnet restore AgentSignaler.slnx -p:Platform=x64
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet build AgentSignaler.slnx --no-restore --configuration Release -p:Platform=x64 -p:Version=$env:RELEASE_VERSION
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          foreach ($project in @('Service', 'Remote', 'Integration', 'Tunneling', 'Dashboard.Core')) {
            $testProject = "tests\AgentSignaler.$project.Tests\AgentSignaler.$project.Tests.csproj"
            dotnet test $testProject --no-build --configuration Release -p:Platform=x64
            if ($LASTEXITCODE -ne 0 -and $project -eq 'Remote') {
              Write-Warning 'Remote tests encountered transient runner file contention; retrying the complete project once.'
              Start-Sleep -Seconds 2
              dotnet test $testProject --no-build --configuration Release -p:Platform=x64
            }
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
      - name: Audit NuGet dependencies
        shell: pwsh
        run: .\scripts\Test-DependencyAudit.ps1
      - name: Isolate Azure CLI state
        shell: pwsh
        run: |
          $config = Join-Path $env:RUNNER_TEMP 'agent-signaler-azure'
          "AZURE_CONFIG_DIR=$config" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Create application signing catalog
        shell: pwsh
        run: |
          $publishRoot = Join-Path $env:GITHUB_WORKSPACE 'artifacts\publish'
          $catalog = Join-Path $publishRoot 'signing-catalog.txt'
          $payloads = @('dashboard', 'remote') | ForEach-Object { Join-Path $publishRoot $_ }
          $files = @(Get-ChildItem -LiteralPath $payloads -File -Recurse |
            Where-Object {
              $_.Name -like 'AgentSignaler.*' -and
              $_.Extension -in @('.exe', '.dll')
            })
          if ($files.Count -eq 0) {
            throw 'No first-party application binaries were found to sign.'
          }
          $files | ForEach-Object {
            './' + ([IO.Path]::GetRelativePath($publishRoot, $_.FullName) -replace '\\', '/')
          } | Set-Content -LiteralPath $catalog -Encoding ascii
      - name: Sign application binaries
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
          files-catalog: ${{ github.workspace }}\artifacts\publish\signing-catalog.txt
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - name: Build and validate installers
        shell: powershell
        run: .\scripts\Build-Installers.ps1 -Version $env:RELEASE_VERSION -SkipPublish -ApplicationMsisOnly
      - name: Create MSI signing catalog
        shell: pwsh
        run: |
          $msiRoot = Join-Path $env:GITHUB_WORKSPACE 'artifacts\msi'
          $names = @('AgentSignaler.Dashboard.msi', 'AgentSignaler.Remote.msi')
          foreach ($name in $names) {
            if (-not (Test-Path -LiteralPath (Join-Path $msiRoot $name) -PathType Leaf)) {
              throw "Missing application package: $name"
            }
          }
          $names | ForEach-Object { ".\$_" } |
            Set-Content -LiteralPath (Join-Path $msiRoot 'signing-catalog.txt') -Encoding ascii
      - name: Sign MSI packages
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
          files-catalog: ${{ github.workspace }}\artifacts\msi\signing-catalog.txt
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - name: Verify release signatures
        shell: pwsh
        run: |
          $publishRoot = Join-Path $env:GITHUB_WORKSPACE 'artifacts\publish'
          $targets = @(
            Get-Content -LiteralPath (Join-Path $publishRoot 'signing-catalog.txt') |
              ForEach-Object { Join-Path $publishRoot $_ }
          )
          $msis = @('AgentSignaler.Dashboard.msi', 'AgentSignaler.Remote.msi') |
            ForEach-Object { Join-Path $env:GITHUB_WORKSPACE "artifacts\msi\$_" }
          $targets += $msis
          foreach ($target in $targets) {
            $signature = Get-AuthenticodeSignature -LiteralPath $target
            $publisher = if ($null -eq $signature.SignerCertificate) {
              $null
            }
            else {
              $signature.SignerCertificate.GetNameInfo(
                [Security.Cryptography.X509Certificates.X509NameType]::SimpleName,
                $false)
            }
            if ($signature.Status -ne 'Valid' -or
                $publisher -ne 'Andy Sterland' -or
                $null -eq $signature.TimeStamperCertificate) {
              throw "Signature verification failed for $target`: $($signature.Status)"
            }
          }
      - name: Clear Azure signing session
        if: always()
        shell: pwsh
        run: |
          if (-not [string]::IsNullOrWhiteSpace($env:AZURE_CONFIG_DIR) -and
              (Test-Path -LiteralPath $env:AZURE_CONFIG_DIR)) {
            az logout
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            Remove-Item -LiteralPath $env:AZURE_CONFIG_DIR -Recurse -Force
          }
      - name: Prepare release assets and notes
        shell: pwsh
        run: |
          $release = Join-Path $env:GITHUB_WORKSPACE ('artifacts\release\' + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $release | Out-Null
          "RELEASE_DIRECTORY=$release" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $assets = @(
            'AgentSignaler.Dashboard.msi',
            'AgentSignaler.Remote.msi'
          )
          foreach ($asset in $assets) {
            Copy-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE "artifacts\msi\$asset") `
              -Destination (Join-Path $release $asset)
          }
          $assets | ForEach-Object {
            $hash = (Get-FileHash -LiteralPath (Join-Path $release $_) -Algorithm SHA256).Hash
            "$hash  $_"
          } | Set-Content -LiteralPath (Join-Path $release 'SHA256SUMS.txt') -Encoding ascii
          @"
          > [!IMPORTANT]
          > The MSI packages and first-party executable payloads are signed and timestamped.
          > Verify the publisher and SHA-256 checksums before installation.

          Agent Signaler $env:RELEASE_VERSION was built and validated by GitHub Actions
          from commit ``$env:GITHUB_SHA``.

          Assets:

          - ``AgentSignaler.Dashboard.msi`` - dashboard installation
          - ``AgentSignaler.Remote.msi`` - remote Dev Box installation
          - ``SHA256SUMS.txt`` - SHA-256 checksums for the signed Dashboard and Remote MSIs

          ### Updater transition and manual retirement

          Refresh the repository to this release revision before updating. Both
          ``scripts\Update-AgentSignaler.ps1`` and ``scripts\UpdaterPolicy.ps1`` must
          come from this revision; replacing only the entry script is insufficient.
          Old updater copies require retired assets in the checksum manifest and reject
          this Dashboard/Remote-only release even with ``-Apps Remote``. The new updater
          rejects historical manifests containing retired assets; do not use it until
          this matching reduced release is published. If scripts cannot be refreshed,
          manually install these signed Dashboard and Remote MSIs instead.

          The standalone RpcHost is retired; no automatic uninstall or migration is
          performed. Stop the exact installed host and remove it manually through Windows
          Installed Apps as the original installing user, approving its MSI elevation.
          Preserve shared Dashboard settings, SQLite data, and tunnel identity. Script-created
          firewall rules require separate ownership-verified cleanup with the previously
          reviewed helper; MSI removal does not remove them. See the
          [retirement record](https://github.com/$env:GITHUB_REPOSITORY/blob/$env:GITHUB_SHA/docs/rpc-host-retirement.md)
          for the final historical release, stable MSI identity, and manual cleanup sequence.
          Historical releases remain available for manual recovery only.

          Actual install/repair/upgrade/uninstall/rollback and clean-image execution
          are **Not run - deferred release acceptance**; read-only gates do not prove them.

          Review the [acceptance record](https://github.com/$env:GITHUB_REPOSITORY/blob/$env:GITHUB_SHA/docs/ACCEPTANCE.md)
          and [installer guide](https://github.com/$env:GITHUB_REPOSITORY/blob/$env:GITHUB_SHA/installers/README.md)
          before installation.
          "@ | Set-Content -LiteralPath (Join-Path $release 'release-notes.md') -Encoding utf8
      - name: Publish GitHub Release
        shell: pwsh
        run: |
          $release = $env:RELEASE_DIRECTORY
          $arguments = @(
            'release', 'create', "v$env:RELEASE_VERSION",
            (Join-Path $release 'AgentSignaler.Dashboard.msi'),
            (Join-Path $release 'AgentSignaler.Remote.msi'),
            (Join-Path $release 'SHA256SUMS.txt'),
            '--repo', $env:GITHUB_REPOSITORY,
            '--target', $env:GITHUB_SHA,
            '--title', "Agent Signaler $env:RELEASE_VERSION",
            '--notes-file', (Join-Path $release 'release-notes.md')
          )
          if ($env:RELEASE_PRERELEASE -eq 'true') {
            $arguments += '--prerelease'
          }
          & gh @arguments
          if ($LASTEXITCODE -ne 0) {
            throw "GitHub Release creation failed with exit code $LASTEXITCODE."
          }
