name: Release MSIs

on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: Mark the GitHub Release as a prerelease
        required: true
        default: true
        type: boolean
      confirm_unsigned:
        description: I understand these MSIs are unsigned
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-msis-${{ github.repository }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: windows-latest
    timeout-minutes: 75
    env:
      AGENT_SIGNALER_LIVE_TUNNEL_TEST: "0"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      RELEASE_PRERELEASE: ${{ inputs.prerelease }}
      RELEASE_UNSIGNED_CONFIRMED: ${{ inputs.confirm_unsigned }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Validate release request
        shell: pwsh
        run: |
          if ($env:RELEASE_UNSIGNED_CONFIRMED -ne 'true') {
            throw 'Publishing requires explicit confirmation that the MSIs are unsigned.'
          }

          $releaseRecords = & gh api --paginate "repos/$env:GITHUB_REPOSITORY/releases" `
            --jq '.[] | [.tag_name, .draft] | @tsv'
          if ($LASTEXITCODE -ne 0) {
            throw "Could not enumerate published releases (gh exit code $LASTEXITCODE)."
          }

          $highest = $null
          $allReleaseTags = [Collections.Generic.HashSet[string]]::new(
            [StringComparer]::Ordinal)
          foreach ($record in $releaseRecords) {
            $tag, $isDraft = $record -split "`t", 2
            [void]$allReleaseTags.Add($tag)
            if ($isDraft -eq 'true') {
              continue
            }
            if ($tag -notmatch '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') {
              continue
            }

            $parts = @($Matches[1], $Matches[2], $Matches[3])
            $values = foreach ($part in $parts) {
              $value = 0L
              if (-not [long]::TryParse(
                  $part,
                  [Globalization.NumberStyles]::None,
                  [Globalization.CultureInfo]::InvariantCulture,
                  [ref]$value)) {
                throw "Release tag $tag has a numeric component too large to process."
              }
              $value
            }

            $candidate = [pscustomobject]@{
              Major = $values[0]
              Minor = $values[1]
              Patch = $values[2]
            }
            if ($null -eq $highest -or
                $candidate.Major -gt $highest.Major -or
                ($candidate.Major -eq $highest.Major -and $candidate.Minor -gt $highest.Minor) -or
                ($candidate.Major -eq $highest.Major -and
                 $candidate.Minor -eq $highest.Minor -and
                 $candidate.Patch -gt $highest.Patch)) {
              $highest = $candidate
            }
          }

          if ($null -eq $highest) {
            $next = [pscustomobject]@{ Major = 0L; Minor = 0L; Patch = 1L }
          }
          else {
            if ($highest.Major -gt 255 -or $highest.Minor -gt 255 -or $highest.Patch -gt 65535) {
              throw "Highest release version v$($highest.Major).$($highest.Minor).$($highest.Patch) exceeds MSI limits."
            }
            if ($highest.Patch -eq 65535) {
              throw "Cannot increment v$($highest.Major).$($highest.Minor).$($highest.Patch): the MSI patch limit is 65535."
            }
            $next = [pscustomobject]@{
              Major = $highest.Major
              Minor = $highest.Minor
              Patch = $highest.Patch + 1
            }
          }

          $releaseVersion = "$($next.Major).$($next.Minor).$($next.Patch)"
          if ($allReleaseTags.Contains("v$releaseVersion")) {
            throw "Release v$releaseVersion already exists; existing releases are never replaced."
          }
          "RELEASE_VERSION=$releaseVersion" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Next release version: $releaseVersion"
      - name: Audit repository contents
        shell: powershell
        run: .\scripts\Test-PublicRepository.ps1
      - name: Build and validate installers
        shell: powershell
        run: .\scripts\Build-Installers.ps1 -Version $env:RELEASE_VERSION -ApplicationMsisOnly
      - name: Build and test release contracts
        shell: pwsh
        run: |
          dotnet restore AgentSignaler.slnx -p:Platform=x64
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet build AgentSignaler.slnx --no-restore --configuration Release -p:Platform=x64 -p:Version=$env:RELEASE_VERSION
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $env:AGENT_SIGNALER_RPC_TEST_EXE = Join-Path $env:GITHUB_WORKSPACE 'artifacts\publish\rpchost\AgentSignaler.RpcHost.exe'
          foreach ($project in @('Service', 'Remote', 'Integration', 'Tunneling', 'Dashboard.Core', 'RpcHost')) {
            dotnet test "tests\AgentSignaler.$project.Tests\AgentSignaler.$project.Tests.csproj" --no-build --configuration Release -p:Platform=x64
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tests/AgentSignaler.RpcHost.Web.Tests/package-lock.json
      - name: Audit NuGet dependencies
        shell: pwsh
        run: .\scripts\Test-DependencyAudit.ps1
      - name: Validate browser contract and dependencies
        shell: pwsh
        working-directory: tests/AgentSignaler.RpcHost.Web.Tests
        run: |
          npm ci
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npx playwright install chromium
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run typecheck
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run test:unit
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm audit --omit=optional --audit-level=high
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $env:AGENT_SIGNALER_RPC_HOST_EXE = Join-Path $env:GITHUB_WORKSPACE 'artifacts\publish\rpchost\AgentSignaler.RpcHost.exe'
          $env:AGENT_SIGNALER_RPC_WEB_NETWORK_TESTS = '1'
          npm run test:browser
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Prepare release assets and notes
        shell: pwsh
        run: |
          $release = Join-Path $env:GITHUB_WORKSPACE 'artifacts\release'
          New-Item -ItemType Directory -Path $release -Force | Out-Null
          $assets = @(
            'AgentSignaler.Dashboard.msi',
            'AgentSignaler.Remote.msi',
            'AgentSignaler.RpcHost.msi'
          )
          foreach ($asset in $assets) {
            Copy-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE "artifacts\msi\$asset") `
              -Destination (Join-Path $release $asset)
          }
          Copy-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'artifacts\publish\rpchost\AgentSignaler.RpcHost.exe') `
            -Destination (Join-Path $release 'AgentSignaler.RpcHost.exe')
          $assets += 'AgentSignaler.RpcHost.exe'
          Copy-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'artifacts\publish\rpchost\THIRD-PARTY-NOTICES.txt') `
            -Destination (Join-Path $release 'AgentSignaler.RpcHost.NOTICES.txt')
          $assets += 'AgentSignaler.RpcHost.NOTICES.txt'
          $assets | ForEach-Object {
            $hash = (Get-FileHash -LiteralPath (Join-Path $release $_) -Algorithm SHA256).Hash
            "$hash  $_"
          } | Set-Content -LiteralPath (Join-Path $release 'SHA256SUMS.txt') -Encoding ascii
          @"
          > [!WARNING]
          > These MSI packages are **unsigned development releases**. Windows may display
          > SmartScreen, publisher, or reputation warnings. Verify the SHA-256 checksums
          > before use and do not treat these packages as signed production artifacts.

          Agent Signaler $env:RELEASE_VERSION was built and validated by GitHub Actions
          from commit ``$env:GITHUB_SHA``.

          Assets:

          - ``AgentSignaler.Dashboard.msi`` - dashboard installation
          - ``AgentSignaler.Remote.msi`` - remote Dev Box installation
          - ``AgentSignaler.RpcHost.msi`` - per-user headless RPC host with mandatory MSI-owned Private receiver firewall rule; servicing requires MSI elevation
          - ``AgentSignaler.RpcHost.exe`` - standalone single-file host; firewall setup is manual
          - ``AgentSignaler.RpcHost.NOTICES.txt`` - redistribution license/notices accompanying the standalone EXE
          - ``SHA256SUMS.txt`` - SHA-256 checksums for the unsigned MSIs, RpcHost EXE and notices

          RpcHost is explicitly launched, never registered at sign-in. Stop the installed
          host before servicing. Its loopback control is unauthenticated: unrelated localhost
          pages and native clients, including other local users, can control it.
          Actual elevated install/repair/upgrade/uninstall/rollback and clean-image execution
          are **Not run - deferred release acceptance**; read-only gates do not prove them.

          Review the [acceptance record](https://github.com/$env:GITHUB_REPOSITORY/blob/$env:GITHUB_SHA/docs/ACCEPTANCE.md)
          and [installer guide](https://github.com/$env:GITHUB_REPOSITORY/blob/$env:GITHUB_SHA/installers/README.md)
          before installation.
          "@ | Set-Content -LiteralPath (Join-Path $release 'release-notes.md') -Encoding utf8
      - name: Publish GitHub Release
        shell: pwsh
        run: |
          $release = Join-Path $env:GITHUB_WORKSPACE 'artifacts\release'
          $arguments = @(
            'release', 'create', "v$env:RELEASE_VERSION",
            (Join-Path $release 'AgentSignaler.Dashboard.msi'),
            (Join-Path $release 'AgentSignaler.Remote.msi'),
            (Join-Path $release 'AgentSignaler.RpcHost.msi'),
            (Join-Path $release 'AgentSignaler.RpcHost.exe'),
            (Join-Path $release 'AgentSignaler.RpcHost.NOTICES.txt'),
            (Join-Path $release 'SHA256SUMS.txt'),
            '--repo', $env:GITHUB_REPOSITORY,
            '--target', $env:GITHUB_SHA,
            '--title', "Agent Signaler $env:RELEASE_VERSION",
            '--notes-file', (Join-Path $release 'release-notes.md')
          )
          if ($env:RELEASE_PRERELEASE -eq 'true') {
            $arguments += '--prerelease'
          }
          & gh @arguments
          if ($LASTEXITCODE -ne 0) {
            throw "GitHub Release creation failed with exit code $LASTEXITCODE."
          }
