name: Feature request
description: Suggest a focused improvement
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem should be solved?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the smallest useful behavior and expected result.
    validations:
      required: true
  - type: textarea
    id: boundaries
    attributes:
      label: Security and ownership boundaries
      description: Note any network, cloud, process, installer, IDE, registry, filesystem, or privacy implications.
    validations:
      required: true
  - type: checkboxes
    id: scope
    attributes:
      label: Scope confirmation
      options:
        - label: I have not included credentials, private identifiers, connection URIs, private URLs, or unrelated source code.
          required: true
